<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <form id="form-cadastro">
            <p id="aviso"></p>
            <input
                type="text"
                id="nome"
                placeholder="Nome"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
            >

            <button type="submit">
                Criar conta
            </button>
        </form>
    </main>
</body>
</html>
